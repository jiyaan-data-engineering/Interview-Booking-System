<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#0f172a" rx="20"/>

  <!-- Concentric circles (network effect) -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#1e3a8a" stroke-width="1" opacity="0.3"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#1e3a8a" stroke-width="1" opacity="0.3"/>
  <circle cx="100" cy="100" r="40" fill="none" stroke="#1e3a8a" stroke-width="1" opacity="0.3"/>

  <!-- Connection lines -->
  <!-- Center to nodes -->
  <line x1="100" y1="100" x2="100" y2="40" stroke="#10b981" stroke-width="2"/>
  <line x1="100" y1="100" x2="160" y2="100" stroke="#3b82f6" stroke-width="2"/>
  <line x1="100" y1="100" x2="100" y2="160" stroke="#10b981" stroke-width="2"/>
  <line x1="100" y1="100" x2="50" y2="100" stroke="#ef4444" stroke-width="2"/>

  <!-- Node to node connections -->
  <line x1="100" y1="40" x2="160" y2="100" stroke="#fbbf24" stroke-width="2"/>
  <line x1="160" y1="100" x2="100" y2="160" stroke="#ef4444" stroke-width="2"/>
  <line x1="100" y1="160" x2="50" y2="100" stroke="#10b981" stroke-width="2"/>
  <line x1="50" y1="100" x2="100" y2="40" stroke="#3b82f6" stroke-width="2"/>

  <!-- Additional inner connection -->
  <line x1="160" y1="100" x2="125" y2="100" stroke="#3b82f6" stroke-width="2"/>

  <!-- Center node (larger) -->
  <circle cx="100" cy="100" r="12" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="6" fill="white"/>

  <!-- Outer nodes -->
  <!-- Top (Green) -->
  <circle cx="100" cy="40" r="10" fill="#10b981" filter="url(#glow)"/>

  <!-- Right (Blue) -->
  <circle cx="160" cy="100" r="10" fill="#3b82f6" filter="url(#glow)"/>

  <!-- Bottom (Green) -->
  <circle cx="100" cy="160" r="10" fill="#10b981" filter="url(#glow)"/>

  <!-- Left (Red) -->
  <circle cx="50" cy="100" r="10" fill="#ef4444" filter="url(#glow)"/>

  <!-- Top-right (Yellow) -->
  <circle cx="140" cy="60" r="8" fill="#fbbf24" filter="url(#glow)"/>

  <!-- Bottom-right (Red) -->
  <circle cx="130" cy="140" r="8" fill="#ef4444" filter="url(#glow)"/>

  <!-- Glow effect definition -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>